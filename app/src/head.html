<title>The Chog of Wall Street</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a toy-box Monopoly board on a Monad-night table, with a control panel docked to the right (stacked under on phones). One committed dark look. */
:root{
  --night:#150f28; --table:#1f1740; --felt:#2a2052; --paper:#f6f2ff; --paper-2:#e9e2fb;
  --ink:#130d24; --ink-soft:#4b3f72; --muted:#a99cd6; --line:#3a2e6b;
  --chog:#8b5cf6; --chog-hi:#b597ff; --gold:#ffc83d; --gold-deep:#c7901a;
  --good:#3ddc97; --bad:#ff5d73; --warn:#ffb648;
  --d-brown:#a8643f; --d-lblue:#7fd3f7; --d-pink:#ff7ac8; --d-orange:#ff9f43;
  --d-red:#ff4d5e; --d-yellow:#ffd84a; --d-green:#3cc47c; --d-dblue:#4a63ff;
  --d-station:#c9c2e8; --d-util:#9ee8dd;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --shadow:3px 3px 0 var(--ink);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:14px;line-height:1.45;
  background-image:radial-gradient(circle at 20% 0%,#2b1e5c 0,transparent 45%),radial-gradient(circle at 90% 100%,#22164a 0,transparent 40%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--chog-hi)}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;max-width:1360px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--night) 92%,transparent);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
header.top .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1360px;margin:0 auto}
.logo{font-family:var(--display);font-size:clamp(15px,2.4vw,22px);letter-spacing:.5px;color:var(--gold);text-shadow:2px 2px 0 var(--chog);white-space:nowrap}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border:2px solid var(--chog);border-radius:99px;color:var(--chog-hi);font-weight:700}
.clock{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.clock .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--felt);border:2px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.btn{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r);padding:8px 12px;font-weight:700;box-shadow:var(--shadow);transition:transform .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.gold{background:var(--gold)}
.btn.purple{background:var(--chog);color:#fff}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--line);box-shadow:none}
.btn.sm{padding:5px 9px;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
.btn.danger{background:var(--bad);color:var(--ink)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start;margin-top:14px}
@media (max-width:1060px){.layout{grid-template-columns:minmax(0,1fr)}}

/* ---------- board ---------- */
.boardbox{width:100%;max-width:820px;margin:0 auto}
.board{position:relative;display:grid;grid-template-columns:1.55fr repeat(9,1fr) 1.55fr;grid-template-rows:1.55fr repeat(9,1fr) 1.55fr;aspect-ratio:1/1;max-width:100%;
  background:var(--table);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:4px;gap:3px}
.tile{position:relative;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:5px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;cursor:pointer;padding:0}
.tile:hover{filter:brightness(1.06)}
.tile .band{height:22%;min-height:6px;border-bottom:2px solid var(--ink);flex:none}
.tile .tn{font-size:clamp(6px,0.95vw,10.5px);font-weight:700;line-height:1.05;padding:2px 2px 0;text-align:center;overflow-wrap:anywhere}
.tile .tp{font-family:var(--mono);font-size:clamp(5.5px,0.8vw,9px);text-align:center;color:var(--ink-soft);margin-top:auto;padding-bottom:2px}
.tile .lv{display:flex;gap:1px;justify-content:center;padding:1px 0}
.tile .lv i{width:clamp(3px,.5vw,6px);height:clamp(3px,.5vw,6px);background:var(--paper-2);border:1px solid var(--ink-soft);border-radius:1px}
.tile .lv i.on{background:var(--good);border-color:var(--ink)}
.tile.side-l,.tile.side-r{flex-direction:row}
.tile.side-l .band{order:2;height:auto;width:22%;border-bottom:0;border-left:2px solid var(--ink)}
.tile.side-r .band{height:auto;width:22%;border-bottom:0;border-right:2px solid var(--ink)}
.tile.side-l .body,.tile.side-r .body{flex:1;display:flex;flex-direction:column;min-width:0}
.tile .body{flex:1;display:flex;flex-direction:column;min-height:0}
.tile.corner{background:var(--gold);justify-content:center;align-items:center;text-align:center}
.tile.corner .cn{font-family:var(--display);font-size:clamp(7px,1.15vw,13px);line-height:1}
.tile.corner .cs{font-size:clamp(6px,.75vw,9px);font-weight:600;padding:0 2px}
.tile.special{background:var(--paper-2)}
.tile.special .tn{margin-top:auto;margin-bottom:auto}
.tile.hot{box-shadow:inset 0 0 0 3px var(--gold)}
.tile.hot::after{content:"HOT ×2";position:absolute;top:2px;right:2px;font-size:7px;font-weight:800;background:var(--gold);border:1px solid var(--ink);border-radius:3px;padding:0 2px}
.tile.landed{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 4px var(--chog)}100%{box-shadow:inset 0 0 0 0 var(--chog)}}
.tile .mine{position:absolute;left:2px;bottom:2px;width:7px;height:7px;border-radius:50%;background:var(--gold);border:1px solid var(--ink)}
.pawns{position:absolute;inset:auto 0 12% 0;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;pointer-events:none}
.pawn{width:clamp(12px,2.1vw,22px);height:clamp(12px,2.1vw,22px);border-radius:50%;border:2px solid var(--ink);background-size:cover;background-position:center;box-shadow:1px 1px 0 var(--ink)}
.pawn.me{width:clamp(18px,3vw,32px);height:clamp(18px,3vw,32px);border-color:var(--gold);box-shadow:0 0 0 2px var(--ink),0 0 10px var(--gold);z-index:2;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}

.center{grid-column:2/11;grid-row:2/11;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:10px;background:
  linear-gradient(transparent 0 70%,#00000030 100%),repeating-linear-gradient(45deg,#2a2052 0 12px,#281e4e 12px 24px);border-radius:8px;border:2px solid var(--ink);min-width:0;min-height:0;overflow:hidden}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.citytitle{font-family:var(--display);font-size:clamp(16px,3.3vw,34px);color:var(--gold);text-shadow:3px 3px 0 var(--ink);line-height:.95}
.citysub{font-size:clamp(9px,1vw,12px);color:var(--muted);margin-top:4px}
.statue{display:flex;flex-direction:column;align-items:center;gap:2px}
.statue .img{width:clamp(34px,6vw,64px);aspect-ratio:1;border-radius:12px;border:3px solid var(--gold-deep);background-size:cover;background-position:center;filter:sepia(1) saturate(3.2) hue-rotate(-12deg) brightness(1.05);box-shadow:0 6px 0 var(--gold-deep),0 0 22px #ffc83d55}
.statue small{font-size:clamp(7px,.8vw,10px);color:var(--gold);font-weight:700;text-align:center;max-width:110px}
.cmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1vw,12px);min-height:0}
.dice{display:flex;gap:clamp(6px,1.2vw,14px)}
.die{width:clamp(30px,5.4vw,58px);aspect-ratio:1;background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%}
.die b{width:62%;aspect-ratio:1;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die b.v{visibility:visible}
.die.roll{animation:tumble .55s cubic-bezier(.3,1.6,.6,1)}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}40%{transform:rotate(200deg) translateY(-14px)}100%{transform:rotate(360deg)}}
.rollbtn{font-family:var(--display);font-size:clamp(14px,2.3vw,24px);padding:clamp(6px,1vw,12px) clamp(18px,3vw,36px);background:var(--gold);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);color:var(--ink)}
.rollbtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.rollbtn[disabled]{opacity:.5}
.plans{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.plans button{font-size:clamp(9px,1vw,12px);font-weight:700;padding:3px 8px;border:2px solid var(--ink);border-radius:99px;background:var(--paper-2);color:var(--ink)}
.plans button[aria-pressed="true"]{background:var(--chog);color:#fff}
.energy{display:flex;gap:3px;align-items:center;font-size:clamp(8px,.9vw,11px);color:var(--muted)}
.energy i{width:clamp(7px,1vw,11px);height:clamp(10px,1.4vw,15px);border:2px solid var(--ink);border-radius:2px;background:#3a2e6b}
.energy i.on{background:var(--good)}
.cbot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pot{background:var(--night);border:2px solid var(--ink);border-radius:8px;padding:4px 6px;min-width:0}
.pot span{display:block;font-size:clamp(6.5px,.75vw,9.5px);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pot b{font-family:var(--mono);font-size:clamp(9px,1.15vw,14px);color:var(--paper)}
.pot.gold b{color:var(--gold)}
.lastev{font-size:clamp(9px,1.05vw,13px);text-align:center;color:var(--paper);min-height:1.4em;max-width:95%}
.bell{font-family:var(--mono);color:var(--bad);font-weight:600;font-size:clamp(9px,1vw,12px)}
.float{position:absolute;z-index:9;font-family:var(--display);font-size:13px;pointer-events:none;color:var(--gold);text-shadow:2px 2px 0 var(--ink);animation:rise 1.4s ease-out forwards}
.float.bad{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-34px) scale(1)}}

/* ---------- panel ---------- */
.panel{background:var(--table);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);min-width:0;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:3px solid var(--ink)}
.tabs button{background:var(--felt);border:0;border-right:2px solid var(--ink);padding:10px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tabpane{padding:14px;display:flex;flex-direction:column;gap:12px}
.h{font-family:var(--display);font-size:15px;color:var(--gold);letter-spacing:.3px}
.sub{font-size:12px;color:var(--muted)}
.card{background:var(--felt);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.paper{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:var(--shadow)}
.card.paper .sub{color:var(--ink-soft)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .card.paper .kv dt{color:var(--ink-soft)}
.kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.deed{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center}
.deed .art{width:92px;aspect-ratio:1;border-radius:12px;border:3px solid var(--ink);background-size:cover;background-position:center;box-shadow:var(--shadow);position:relative}
.deed .art .mood{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:0 6px;white-space:nowrap}
.deed .nm{font-family:var(--display);font-size:16px;line-height:1.1;overflow-wrap:anywhere}
.big{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--ink);line-height:1.1}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:2px solid var(--ink)}
.pill.ok{background:var(--good);color:var(--ink)} .pill.no{background:var(--bad);color:var(--ink)} .pill.warn{background:var(--warn);color:var(--ink)} .pill.tier{background:var(--chog-hi);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.bar{height:10px;border-radius:99px;background:var(--night);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--chog),var(--gold))}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--night);border:2px solid var(--line);border-radius:10px;padding:7px 9px}
.li .sw{width:10px;height:28px;border-radius:3px;border:1.5px solid var(--ink)}
.li .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:11px;color:var(--muted)}
.feed{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:12px}
.feed div{padding:4px 6px;border-left:3px solid var(--line);color:var(--paper)}
.feed div.me{border-left-color:var(--gold)}
.feed div.bad{border-left-color:var(--bad)}
.feed time{font-family:var(--mono);color:var(--muted);font-size:10px;margin-right:6px}
.lb{display:grid;grid-template-columns:22px 26px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.lb .av{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background-size:cover}
.lb.me{color:var(--gold)}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.stamps i{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:8px;font-style:normal;font-weight:800;color:var(--muted)}
.stamps i.got{border:2px solid var(--ink);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--gold)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare .opt{border:2px solid var(--ink);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;gap:4px}
.compare .opt.best{background:var(--gold)}
.compare .opt b{font-family:var(--mono);font-size:18px}
.compare .opt small{font-size:11px;color:var(--ink-soft)}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--chog);padding-left:8px}

/* ---------- sheets / overlays ---------- */
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;width:min(92%,420px);max-height:86%;overflow:auto;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px}
.sheet .band{height:12px;border:2px solid var(--ink);border-radius:6px;margin:-4px 0 0}
.sheet h3{margin:0;font-family:var(--display);font-size:18px;line-height:1.1}
.sheet .sub{color:var(--ink-soft)}
.sheet .kv dt{color:var(--ink-soft)}
.sheet .quest{background:var(--paper-2);border:2px solid var(--ink);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.sheet .x{position:absolute;right:8px;top:8px;background:none;border:0;font-size:20px;line-height:1;color:var(--ink)}
.holders{display:flex;flex-wrap:wrap;gap:6px}
.holders span{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;background:var(--paper-2);border:1.5px solid var(--ink);border-radius:99px;padding:1px 6px 1px 1px}
.holders span i{width:18px;height:18px;border-radius:50%;background-size:cover;border:1px solid var(--ink)}
.targets{display:flex;flex-direction:column;gap:6px}
.targets button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:var(--paper-2);border:2px solid var(--ink);border-radius:10px;padding:6px 8px;color:var(--ink)}
.targets button i{width:30px;height:30px;border-radius:50%;background-size:cover;border:2px solid var(--ink)}

.overlay{position:fixed;inset:0;z-index:40;background:#0d0820e6;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wake{width:min(980px,100%);background:var(--table);border:3px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:22px;display:flex;flex-direction:column;gap:16px}
.wake h1{margin:0;font-family:var(--display);font-size:clamp(26px,5vw,48px);line-height:.95;color:var(--gold);text-shadow:3px 3px 0 var(--chog);text-wrap:balance}
.wake p.lead{margin:0;max-width:62ch;color:var(--paper);font-size:15px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.pick button{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:left;box-shadow:var(--shadow)}
.pick button[aria-pressed="true"]{background:var(--gold);transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.pick .im{aspect-ratio:1;border-radius:8px;background-size:cover;border:2px solid var(--ink)}
.pick b{font-size:12px;line-height:1.1}
.pick small{font-size:10.5px;color:var(--ink-soft);font-family:var(--mono)}
.wakebar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.wakebar{grid-template-columns:1fr}}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rules div{background:var(--felt);border:2px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.rules b{display:block;color:var(--gold);font-family:var(--display);font-size:12px;margin-bottom:2px;letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:10px 14px;font-weight:600;max-width:min(92vw,520px)}
.minifeed{display:flex;flex-direction:column;gap:3px;width:min(92%,460px);font-size:clamp(8px,.9vw,11.5px);color:var(--muted)}
.minifeed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--line);padding-left:6px}
.minifeed div.me{border-left-color:var(--gold);color:var(--paper)} .minifeed div.bad{border-left-color:var(--bad)}
