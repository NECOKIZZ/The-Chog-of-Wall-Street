<title>The Chog of Wall Street</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A Monopoly-style city on Monad where the land belongs to Chog NFTs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<script>/* apply the saved theme before first paint */ try { const t = localStorage.getItem("cows.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }</script>
<style>
/* "Arcade exchange": a Chog-purple game world. Gold is the one hot accent (coins, the Roll key).
   Green appears only for gains (PNL) and red for losses. Buttons are 3D keycaps: a face on a darker ledge that presses down.
   Landing → open an account → app rooms (Desk, Map, Leaders, Bank, Rules). Light and dark, toggled in the nav. */
:root{
  --bg:#F4F1FB; --bg-2:#EAE4F7; --card:#FFFFFF; --raise:#F6F3FD; --ink:#1C1433; --ink-2:#5A5174; --ink-3:#8C84A4;
  --line:rgba(28,20,51,.11); --line-2:rgba(28,20,51,.20); --ledge:#D7CFEA;
  --purple:#7042F5; --purple-deep:#4C21C4; --on-purple:#FFFFFF; --purple-soft:#ECE5FF;
  --gold:#FFB524; --gold-deep:#C47F06; --on-gold:#2A1A00; --gold-soft:#FFF1D2;
  --red:#E5484D; --red-deep:#AE2A2F; --red-soft:#FDE4E5;
  --up:#109B57; --down:#D93A40;
  --stage:#22124D; --stage-2:#331C6E; --on-stage:#FFFFFF; --on-stage-2:rgba(255,255,255,.72);
  --shadow:0 10px 30px rgba(42,22,99,.08);
  --board:#E9E3F6; --tile:#FFFFFF; --tile-2:#F2EDFC; --tile-edge:#C4B7E6; --cream:#FFFDF7; --cream-hi:#FFF7E3; --tile-line:rgba(28,20,51,.32);
  --d-brown:#9A5B3C; --d-lblue:#4FB6E5; --d-pink:#E85CA8; --d-orange:#F08A24; --d-red:#DD3F4E; --d-yellow:#E8BB16;
  --d-green:#159F9B; --d-dblue:#3550D9; --d-station:#6F7690; --d-util:#9C8FB8;
  --display:'Bricolage Grotesque','Arial Rounded MT Bold',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:20px; --r-sm:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100B20; --bg-2:#17102E; --card:#1C1536; --raise:#241B44; --ink:#F1EDFF; --ink-2:#B9B0D6; --ink-3:#8278A4;
  --line:rgba(241,237,255,.09); --line-2:rgba(241,237,255,.18); --ledge:#0A0716;
  --purple:#8B66FF; --purple-deep:#5530D4; --on-purple:#FFFFFF; --purple-soft:#2D2259;
  --gold:#FFC23D; --gold-deep:#B37600; --on-gold:#241500; --gold-soft:#3A2C10;
  --red:#FF5C68; --red-deep:#B42C39; --red-soft:#3D1A22;
  --up:#3ED492; --down:#FF6B76;
  --stage:#1A0F3C; --stage-2:#2A1A5E;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --board:#17102E; --tile:#2C2354; --tile-2:#241C47; --tile-edge:#0A0716; --cream:#221A3F; --cream-hi:#2B2250; --tile-line:rgba(241,237,255,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100B20; --bg-2:#17102E; --card:#1C1536; --raise:#241B44; --ink:#F1EDFF; --ink-2:#B9B0D6; --ink-3:#8278A4;
  --line:rgba(241,237,255,.09); --line-2:rgba(241,237,255,.18); --ledge:#0A0716;
  --purple:#8B66FF; --purple-deep:#5530D4; --on-purple:#FFFFFF; --purple-soft:#2D2259;
  --gold:#FFC23D; --gold-deep:#B37600; --on-gold:#241500; --gold-soft:#3A2C10;
  --red:#FF5C68; --red-deep:#B42C39; --red-soft:#3D1A22;
  --up:#3ED492; --down:#FF6B76;
  --stage:#1A0F3C; --stage-2:#2A1A5E;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --board:#17102E; --tile:#2C2354; --tile-2:#241C47; --tile-edge:#0A0716; --cream:#221A3F; --cream-hi:#2B2250; --tile-line:rgba(241,237,255,.28); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--card)}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(2.5rem,6vw,4.8rem)} h2{font-size:clamp(1.8rem,3.6vw,2.8rem)} h3{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--purple)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:13.5px} .tiny{font-size:12px;color:var(--ink-3)}
.up{color:var(--up)} .down{color:var(--down)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- 3D keycap buttons ---------- */
.btn{--face:var(--card);--edge:var(--ledge);--fg:var(--ink);--lift:4px;
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--face);color:var(--fg);border:1.5px solid var(--edge);border-radius:14px;
  padding:10px 18px;font-weight:800;font-size:14px;letter-spacing:.01em;text-decoration:none;white-space:nowrap;
  box-shadow:0 var(--lift) 0 var(--edge),0 calc(var(--lift) + 4px) 14px rgba(28,20,51,.10),inset 0 1px 0 rgba(255,255,255,.28);
  margin-bottom:var(--lift);transition:transform .1s ease,box-shadow .1s ease,filter .15s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(calc(var(--lift) - 1px));box-shadow:0 1px 0 var(--edge),inset 0 1px 2px rgba(0,0,0,.18)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.primary{--face:var(--purple);--edge:var(--purple-deep);--fg:var(--on-purple);box-shadow:0 var(--lift) 0 var(--edge),0 calc(var(--lift) + 6px) 18px color-mix(in srgb,var(--purple) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.gold,.btn.green{--face:var(--gold);--edge:var(--gold-deep);--fg:var(--on-gold);box-shadow:0 var(--lift) 0 var(--edge),0 calc(var(--lift) + 6px) 18px color-mix(in srgb,var(--gold) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.danger{--face:var(--red);--edge:var(--red-deep);--fg:#fff}
.btn.ink{--face:var(--ink);--edge:#000;--fg:var(--bg)}
.btn.ghost{--lift:0px;background:transparent;border-color:var(--line-2);box-shadow:none}
.btn.ghost:active{transform:translateY(1px)}
.btn.sm{--lift:3px;padding:6px 12px;font-size:12.5px;border-radius:11px}
.btn.lg{--lift:6px;padding:15px 28px;font-size:17px;border-radius:18px}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ledge);margin-bottom:3px;transition:transform .1s,box-shadow .1s}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ledge)}
.iconbtn svg{width:18px;height:18px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 3px 0 var(--line),var(--shadow);min-width:0}
.card.tint{background:var(--raise);box-shadow:none}
.card h3{margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.02em;padding:4px 10px;border-radius:999px;background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.pill.ok,.pill.purple{background:var(--purple-soft);color:var(--purple)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.warn,.pill.gold{background:var(--gold-soft);color:var(--gold-deep)}
:root[data-theme="dark"] .pill.warn,:root[data-theme="dark"] .pill.gold{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.warn,:root:not([data-theme="light"]) .pill.gold{color:var(--gold)}}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 14px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1}
.avatar{border-radius:14px;background-size:cover;background-position:center;background-color:var(--bg-2);flex:none}

/* ---------- nav ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--card);border-bottom:1.5px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.navpill{display:flex;align-items:center;gap:6px;max-width:1200px;height:64px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);border:0;background:none;padding:0}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--purple);display:grid;place-items:center;color:var(--on-purple);font-style:normal;font-size:13px;font-family:var(--display);font-weight:800;box-shadow:0 3px 0 var(--purple-deep)}
.navlinks{display:flex;gap:2px;margin-left:auto;align-items:center}
.navlinks a,.navlinks .roomlink{position:relative;border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink-2);text-decoration:none}
.navlinks a:hover,.navlinks .roomlink:hover{background:var(--bg-2);color:var(--ink)}
.navlinks .roomlink[aria-current="page"]{color:var(--purple)}
.navlinks .roomlink[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-13px;height:3px;border-radius:3px 3px 0 0;background:var(--purple)}
.navtools{display:flex;gap:6px;align-items:center;margin-left:6px}
@media (max-width:760px){.landing-links a{display:none}.brand span{display:none}}

/* ---------- landing ---------- */
.hero{background:radial-gradient(1100px 620px at 78% 35%,var(--stage-2),var(--stage));color:var(--on-stage);padding-top:150px;padding-bottom:120px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.2px);background-size:22px 22px;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.herogrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:80px;align-items:center;min-height:min(640px,calc(100vh - 230px))}
@media (max-width:940px){.herogrid{grid-template-columns:1fr}}
.heropill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.04em;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);color:var(--on-stage);margin-bottom:22px}
.heropill i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent)}
.hero h1{color:var(--on-stage);font-size:clamp(3rem,7.4vw,6.4rem);line-height:.98} .hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);color:var(--on-stage-2);max-width:46ch;margin-top:20px}
.hero .row{margin-top:44px}
.hero .btn.ghost{color:var(--on-stage);border-color:rgba(255,255,255,.3)}
.heroproof{display:flex;align-items:center;gap:12px;margin-top:28px;color:var(--on-stage-2);font-size:13.5px;flex-wrap:wrap}
.stackav{display:flex}
.stackav .avatar{width:34px;height:34px;border-radius:11px;border:2.5px solid var(--stage);margin-left:-10px}
.stackav .avatar:first-child{margin-left:0}
.herostage{position:relative;min-width:0}
.floatcard{position:absolute;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 5px 0 var(--ledge),0 18px 40px rgba(0,0,0,.35);animation:bob 5s ease-in-out infinite}
.floatcard b{display:block;font-size:15px}
.floatcard .tiny{display:block}
.fc1{left:2%;top:4%;padding:0;overflow:hidden;align-items:stretch} .fc1 .band{width:10px} .fc1 .fcbody{padding:10px 4px 10px 2px;display:flex;flex-direction:column} .fc1 img{width:34px;height:34px;border-radius:10px;align-self:center;margin-right:12px}
.fc2{right:0;bottom:10%;animation-delay:-1.6s} .fc2 .avatar{width:36px;height:36px;border-radius:11px}
.fc3{left:10%;bottom:2%;animation-delay:-3.1s;flex-direction:column;align-items:flex-start;gap:0}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (max-width:520px){.fc1{top:-2%}.fc3{display:none}.floatcard{transform:scale(.85)}}
.ticker{position:relative;z-index:1;overflow:hidden;background:var(--gold);color:var(--on-gold);padding:12px 0;white-space:nowrap;border-bottom:3px solid var(--gold-deep)}
.ticker .track{display:inline-flex;gap:42px;animation:marquee 40s linear infinite;padding-left:42px}
.ticker span{font-family:var(--mono);font-size:13px;font-weight:700}
.ticker b{font-weight:700} .ticker b.dn{color:var(--red-deep)}
@keyframes marquee{to{transform:translateX(-50%)}}
.band{padding-top:80px;padding-bottom:84px;position:relative}
.band.a{background:var(--bg)} .band.b{background:var(--bg-2)} .band.c{background:var(--stage);color:var(--on-stage)}
.band.c .muted,.band.c .sechead p{color:var(--on-stage-2)} .band.c .eyebrow{color:var(--gold)}
.band.c .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--on-stage);box-shadow:none}
.sechead{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;max-width:720px}
.sechead p{color:var(--ink-2);font-size:17px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}} @media (max-width:520px){.steps{grid-template-columns:1fr}}
.step .n{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;background:var(--purple);color:var(--on-purple);box-shadow:0 4px 0 var(--purple-deep);margin-bottom:14px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.apps{grid-template-columns:1fr 1fr}} @media (max-width:520px){.apps{grid-template-columns:1fr}}
.appc{display:flex;gap:14px;align-items:center}
.appc img{width:50px;height:50px;border-radius:14px;flex:none;background:#fff;box-shadow:0 3px 0 var(--ledge)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.cities{grid-template-columns:1fr}}
.city{display:flex;flex-direction:column;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 5px 0 var(--ledge);color:var(--ink);transition:transform .12s,box-shadow .12s}
.city:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ledge)}
.city:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ledge)}
.city .what{color:var(--ink-2);font-size:14px}
.city .btn{margin-top:auto;align-self:flex-start;pointer-events:none}
.faq details{border-bottom:1px solid rgba(255,255,255,.14);padding:16px 0}
.faq summary{font-weight:700;cursor:pointer;font-size:16px}
.faq p{margin-top:8px;max-width:70ch}
footer{padding:36px 0 10px;color:var(--on-stage-2);font-size:13px}

/* ---------- onboarding ---------- */
.onboard{min-height:100vh;padding-top:112px;padding-bottom:70px}
.stepper{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.stepper span{font-size:12.5px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--bg-2);color:var(--ink-3)}
.stepper span.on{background:var(--purple);color:var(--on-purple)}
.stepper span.done{background:var(--purple-soft);color:var(--purple)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.pick button{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:8px;color:var(--ink);box-shadow:0 4px 0 var(--ledge);margin-bottom:4px;transition:transform .1s,box-shadow .1s}
.pick button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ledge)}
.pick button[aria-pressed="true"]{border-color:var(--purple);box-shadow:0 4px 0 var(--purple-deep),0 0 0 3px color-mix(in srgb,var(--purple) 25%,transparent)}
.pick .im{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;background-color:var(--bg-2)}
.pick b{font-size:13px;line-height:1.2} .pick small{font-size:11.5px;color:var(--ink-3)}
input[type=range]{width:100%;accent-color:var(--purple)}
.field input[type=number],.field input[type=text],textarea{border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit}

/* ---------- app shell ---------- */
.appmain{padding-top:96px;padding-bottom:110px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:clamp(2rem,4vw,3rem)}
.me-chip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);background:var(--card);border-radius:14px;padding:3px 10px 3px 3px;white-space:nowrap;box-shadow:0 3px 0 var(--ledge);margin-bottom:3px;color:var(--ink)}
.me-chip .avatar{width:32px;height:32px;border-radius:10px}
.mebal{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.mebal small{font-size:10px;font-weight:700;color:var(--ink-3)} .mebal b{font-size:13.5px}
.me-chip .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .15s}
.me-chip[aria-expanded="true"] .chev{transform:rotate(180deg)}
.memenu{position:absolute;right:max(16px,calc((100vw - 1200px) / 2 + 16px));top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));background:var(--card);border:1.5px solid var(--line-2);border-radius:18px;padding:16px;box-shadow:0 5px 0 var(--ledge),0 20px 50px rgba(12,6,32,.25);z-index:31}
.citybadge{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--bg-2);color:var(--ink-2)}
body[data-mode="testnet"] .citybadge{background:var(--purple-soft);color:var(--purple)}
body[data-mode="mainnet"] .citybadge{background:var(--gold-soft);color:var(--gold-deep)}
.tabbar{display:none}
@media (max-width:820px){
  .app-links .roomlink{display:none}
  .mebal small{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(28,20,51,.06);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .tabbar button{flex:1;min-width:0;border:0;background:none;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:11px;letter-spacing:.01em;color:var(--ink-3);-webkit-tap-highlight-color:transparent}
  .tabbar svg{width:22px;height:22px;padding:4px 16px;box-sizing:content-box;border-radius:99px;transition:background .15s,color .15s}
  .tabbar button[aria-current="page"]{color:var(--purple)}
