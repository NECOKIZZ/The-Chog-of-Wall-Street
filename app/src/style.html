<title>The Chog of Wall Street</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A Monopoly-style city on Monad where the land belongs to Chog NFTs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: an editorial "bank statement" world. Banknote-mint paper, ink type, diagonal cards, a floating glass nav pill.
   Landing page → open an account → app with four rooms (Desk, Map, Bank, Rules). Structure borrowed from Kickoff, palette our own. */
:root{
  --paper:#EEF1E8; --paper-2:#E3E8DC; --card:#FBFCF8; --ink:#13201A; --ink-2:#4E5E54; --ink-3:#7C8B80; --line:rgba(19,32,26,.13);
  --purple:#6B3BEF; --purple-2:#4A22C4; --on-purple:#fff; --green:#0F8A52; --gold:#C8961B; --red:#D23A4E; --sky:#2E7CD6;
  --glass:rgba(251,252,248,.74); --glass-line:rgba(19,32,26,.10); --shadow:0 10px 30px rgba(19,32,26,.08);
  --d-brown:#9A5B3C; --d-lblue:#4FB6E5; --d-pink:#E85CA8; --d-orange:#EE8A2E; --d-red:#DD3F4E; --d-yellow:#E3B921;
  --d-green:#2BA866; --d-dblue:#3550D9; --d-station:#7C849C; --d-util:#2FA898;
  --tile:#FBFCF8; --tile-2:#F2F5EC; --board:#D5DECD;
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r-diag:24px 4px 24px 4px; --r-diag-sm:16px 3px 16px 3px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1511; --paper-2:#141D17; --card:#18231C; --ink:#ECF2EA; --ink-2:#A9B8AD; --ink-3:#7E8F84; --line:rgba(236,242,234,.12);
  --purple:#9C7CFF; --purple-2:#7B5CF0; --on-purple:#0E1511; --green:#33D07D; --gold:#F0C348; --red:#FF6176; --sky:#5FA8FF;
  --glass:rgba(24,35,28,.74); --glass-line:rgba(236,242,234,.10); --shadow:0 10px 30px rgba(0,0,0,.35);
  --tile:#1B2720; --tile-2:#202D25; --board:#2A382F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1511; --paper-2:#141D17; --card:#18231C; --ink:#ECF2EA; --ink-2:#A9B8AD; --ink-3:#7E8F84; --line:rgba(236,242,234,.12);
  --purple:#9C7CFF; --purple-2:#7B5CF0; --on-purple:#0E1511; --green:#33D07D; --gold:#F0C348; --red:#FF6176; --sky:#5FA8FF;
  --glass:rgba(24,35,28,.74); --glass-line:rgba(236,242,234,.10); --shadow:0 10px 30px rgba(0,0,0,.35);
  --tile:#1B2720; --tile-2:#202D25; --board:#2A382F; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,6vw,4.6rem)} h2{font-size:clamp(1.7rem,3.4vw,2.6rem)} h3{font-size:1.2rem}
p{margin:0}
a{color:var(--purple)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;text-decoration:none;transition:transform .12s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--purple);border-color:var(--purple);color:var(--on-purple)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:13px} .btn.lg{padding:14px 26px;font-size:16px}

.card h3{margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:3px 10px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.warn{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.pill.purple{background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--purple)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;margin:0}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:clamp(28px,4vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--gold))}
.avatar{border-radius:14px;background-size:cover;background-position:center;background-color:var(--paper-2);flex:none}
.nav{position:fixed;top:max(14px,env(safe-area-inset-top,0px));left:0;right:0;z-index:30;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.navpill{pointer-events:auto;display:flex;align-items:center;gap:6px;width:min(1080px,100%);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-line);border-radius:999px;padding:7px 8px 7px 14px;box-shadow:var(--shadow)}
.brand{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);border:0;background:none;padding:0}
.brand i{width:28px;height:28px;border-radius:9px 2px 9px 2px;background:var(--purple);display:grid;place-items:center;color:var(--on-purple);font-style:normal;font-size:13px;font-family:var(--mono)}
.navlinks{display:flex;gap:2px;margin-left:auto;align-items:center}
.navlinks a,.navlinks button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);text-decoration:none}
.navlinks a:hover,.navlinks button:hover{background:var(--paper-2);color:var(--ink)}
.navlinks button[aria-current="page"]{background:var(--ink);color:var(--paper)}
@media (max-width:760px){.landing-links a{display:none}.brand span{display:none}}
.hero{padding-top:118px;padding-bottom:56px}
.herogrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center}
@media (max-width:900px){.herogrid{grid-template-columns:1fr}}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);color:var(--ink-2);max-width:52ch;margin-top:18px}
.hero .row{margin-top:26px}
.ticker{position:relative;z-index:1;margin-bottom:30px;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);padding:12px 0;white-space:nowrap}
.ticker .track{display:inline-flex;gap:42px;animation:marquee 40s linear infinite;padding-left:42px}
.ticker span{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.ticker b{color:var(--green);font-weight:600} .ticker b.dn{color:var(--red)}
@keyframes marquee{to{transform:translateX(-50%)}}
.band{border-radius:50px 50px 0 0;margin-top:-30px;padding-top:72px;padding-bottom:88px;position:relative}
.band.a{background:var(--card)} .band.b{background:var(--paper)} .band.c{background:var(--ink);color:var(--paper)}
.band.c .muted{color:color-mix(in srgb,var(--paper) 72%,transparent)}
.band.c .card{background:color-mix(in srgb,var(--paper) 7%,transparent);border-color:color-mix(in srgb,var(--paper) 15%,transparent);color:var(--paper);box-shadow:none}
.sechead{display:flex;flex-direction:column;gap:10px;margin-bottom:30px;max-width:720px}
.sechead p{color:var(--ink-2);font-size:17px}
.band.c .sechead p{color:color-mix(in srgb,var(--paper) 72%,transparent)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}} @media (max-width:520px){.steps{grid-template-columns:1fr}}
.step .n{font-family:var(--display);font-size:42px;color:var(--purple);line-height:1;margin-bottom:8px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.apps{grid-template-columns:1fr 1fr}} @media (max-width:520px){.apps{grid-template-columns:1fr}}
.appc{display:flex;gap:14px;align-items:center}
.appc img{width:46px;height:46px;border-radius:12px;flex:none;background:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.cities{grid-template-columns:1fr}}
.city{display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-diag);padding:22px;box-shadow:var(--shadow);color:var(--ink)}
.city:hover{border-color:var(--purple)}
.city .what{color:var(--ink-2);font-size:14px}
.city .btn{margin-top:auto;align-self:flex-start}
.faq details{border-bottom:1px solid color-mix(in srgb,var(--paper) 15%,transparent);padding:16px 0}
.faq summary{font-weight:600;cursor:pointer;font-size:16px}
.faq p{margin-top:8px;max-width:70ch}
footer{padding:36px 0 60px;color:var(--ink-3);font-size:13px}
.onboard{min-height:100vh;padding-top:110px;padding-bottom:70px}
.stepper{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.stepper span{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--paper-2);color:var(--ink-3)}
.stepper span.on{background:var(--ink);color:var(--paper)}
.stepper span.done{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pick button{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-diag-sm);padding:8px;color:var(--ink)}
.pick button[aria-pressed="true"]{border-color:var(--purple);box-shadow:0 0 0 3px color-mix(in srgb,var(--purple) 25%,transparent)}
.pick .im{aspect-ratio:1;border-radius:12px 2px 12px 2px;background-size:cover;background-position:center;background-color:var(--paper-2)}
.pick b{font-size:13px;line-height:1.2} .pick small{font-size:11.5px;color:var(--ink-3)}
input[type=range]{width:100%;accent-color:var(--purple)}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field input[type=number],.field input[type=text],textarea{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
.appmain{padding-top:96px;padding-bottom:110px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:clamp(1.9rem,4vw,2.8rem)}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600;font-size:13px;white-space:nowrap}
.me-chip .avatar{width:28px;height:28px;border-radius:50%}
.citybadge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2)}
body[data-mode="testnet"] .citybadge{color:var(--sky);border-color:var(--sky)}
body[data-mode="mainnet"] .citybadge{color:var(--gold);border-color:var(--gold)}
.tabbar{display:none}
@media (max-width:760px){
  .app-links .roomlink{display:none}
  .me-chip span{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--glass-line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar button{flex:1;border:0;background:none;padding:9px 4px;border-radius:12px;font-weight:600;font-size:13px;color:var(--ink-3)}
  .tabbar button[aria-current="page"]{color:var(--ink);background:var(--paper-2)}
}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.deskhero{display:grid;grid-template-columns:116px minmax(0,1fr);gap:18px;align-items:center}
.deskhero .avatar{width:116px;height:116px;border-radius:24px 4px 24px 4px}
@media (max-width:520px){.deskhero{grid-template-columns:80px minmax(0,1fr)}.deskhero .avatar{width:80px;height:80px}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--paper-2);border-radius:14px 3px 14px 3px;padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--ink-3)}
.stat b{font-family:var(--mono);font-size:17px;font-weight:600}
.move{background:var(--ink);color:var(--paper);border:0}
.move .muted,.move .tiny{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pips i{width:12px;height:18px;border-radius:3px;background:color-mix(in srgb,currentColor 18%,transparent)}
.pips i.on{background:var(--gold)}
.feed{display:flex;flex-direction:column}
.feed .item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.feed .item:last-child{border-bottom:0}
.feed .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--paper-2)}
.feed .ic.plus{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.feed .ic.minus{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.feed .ic.info{background:color-mix(in srgb,var(--purple) 14%,transparent);color:var(--purple)}
.feed .amt{font-family:var(--mono);font-size:13px;font-weight:600}
.feed .amt.plus{color:var(--green)} .feed .amt.minus{color:var(--red)}
.feed time{display:block;font-size:12px;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:14px;padding:10px 0}
.todo{display:flex;flex-direction:column;gap:8px}
.todo button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px 3px 14px 3px;padding:10px 12px;font-weight:600;font-size:14px;color:var(--ink)}
.todo button:hover{border-color:var(--purple)}
.thread{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.thread .avatar{width:40px;height:40px;border-radius:50%}
.thread .t{font-weight:600;font-size:14px} .thread .s{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:9px;height:9px;border-radius:50%;background:var(--purple)}
.lb{display:grid;grid-template-columns:30px 30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}

.lb.me{font-weight:700;color:var(--purple)}
.lb.gap{display:block;color:var(--ink-3);font-size:12px;text-align:center;border-bottom:0;padding:4px 0}
.timer{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.1}
.grid-map{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:980px){.grid-map{grid-template-columns:1fr}}
.mapbox{position:relative;width:100%;max-width:760px;margin:0 auto;aspect-ratio:1/1}
.mapbox.angled{aspect-ratio:1.5/1;perspective:1600px}
.board{position:absolute;inset:0;display:grid;grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;gap:3px;padding:6px;background:var(--board);border-radius:22px}

.tile{position:relative;border:0;padding:0;background:var(--tile);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0;color:var(--ink);text-align:center}

.tile.r{flex-direction:row} .tile.r .bd{width:22%;height:auto}
.tile .tb{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

.lvl i.on{background:var(--green)}
.boardcenter{grid-column:2/11;grid-row:2/11;display:grid;place-items:center;text-align:center;border-radius:12px}
.boardcenter b{font-family:var(--display);font-size:clamp(14px,3vw,34px);line-height:1}
.boardcenter small{display:block;font-size:clamp(8px,1vw,12px);color:var(--ink-3);margin-top:6px}
.pawn{position:absolute;z-index:5;width:clamp(28px,4.4vw,46px);height:clamp(28px,4.4vw,46px);border-radius:50%;border:3px solid var(--purple);background-size:cover;background-position:center;box-shadow:0 6px 14px rgba(0,0,0,.25);transform:translate(-50%,-50%);transition:left .14s linear,top .14s linear;pointer-events:none}
